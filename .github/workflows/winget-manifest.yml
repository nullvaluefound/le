name: Stage WinGet submission
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag
        type: string
        required: true
  release:
    types: [published]
permissions:
  contents: read
jobs:
  generate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r packaging/requirements-build.txt
      - name: Prepare current WinGet client (ephemeral runner only)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./packaging/prepare_winget_ci.ps1
      - name: Download immutable public Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: pwsh
        run: |
          python packaging/release.py validate-public --version $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download $env:RELEASE_TAG --pattern 'le-windows-*.exe' --pattern SHA256SUMS --dir release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/release.py winget --version $env:RELEASE_TAG --artifacts release --output build/winget-submission
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/validate_manifests.py build/winget-submission
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/validate_manifests.py build/winget-submission --winget-client
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: winget-pkgs-submission
          path: build/winget-submission/manifests
          if-no-files-found: error
      # Submission is deliberately manual; no public PR is created or approved.
