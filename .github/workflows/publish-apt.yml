name: Publish signed APT repository
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag (empty refreshes latest)
        type: string
        required: false
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
concurrency:
  group: le-apt-publication
  cancel-in-progress: false
jobs:
  sign:
    if: github.event_name != 'schedule' || vars.LE_APT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: apt-release
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r packaging/requirements-build.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends reprepro gnupg dpkg-dev
      - name: Import protected signing credentials and verify signed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then RELEASE_TAG=$(gh release view --json tagName --jq .tagName); fi
          python packaging/publish_apt.py --tag "$RELEASE_TAG" --output build/apt-public
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/apt-public
  deploy:
    needs: sign
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
